[package]
name = "guide-rs"
version = "0.1.0"
edition = "2024"
description = "Native Rust research implementation of GUIDE-style statistical trees"
authors = ["Brandon Greenwell <greenwell.brandon@gmail.com>"]
license = "MIT"
repository = "https://github.com/bgreenwell/guide-rs"
homepage = "https://github.com/bgreenwell/guide-rs"
readme = "README.md"
keywords = ["decision-tree", "statistics", "regression", "classification", "guide"]
categories = ["science", "algorithms", "command-line-utilities"]
exclude = ["tests/", "tools/", "docs/", "python/", ".github/", "AGENTS.md", "CLAUDE.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
