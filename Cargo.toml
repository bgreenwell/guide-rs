[package]
name = "guide-rs"
version = "0.1.0"
edition = "2024"
description = "Native Rust research implementation of GUIDE-style statistical trees"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
