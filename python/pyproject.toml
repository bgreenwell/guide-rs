[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "guide-rs"
version = "0.2.0"
description = "scikit-learn estimators for GUIDE-style classification and regression trees"
readme = "README.md"
license = "MIT"
authors = [{ name = "Brandon Greenwell", email = "greenwell.brandon@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.urls]
Documentation = "https://bgreenwell.github.io/guide-rs/"
Repository = "https://github.com/bgreenwell/guide-rs"
Changelog = "https://github.com/bgreenwell/guide-rs/blob/main/CHANGELOG.md"
Issues = "https://github.com/bgreenwell/guide-rs/issues"

[dependency-groups]
dev = ["matplotlib>=3.7", "pandas>=2", "pytest>=8", "ruff>=0.6"]
docs = [
    "furo>=2025.12.19",
    "myst-nb>=1.4.0",
    "numpydoc>=1.11.0",
    "sphinx>=8.1.3",
]
# Running and re-executing the example notebooks.
examples = ["ipykernel>=6", "matplotlib>=3.7", "nbclient>=0.10", "nbformat>=5", "pandas>=2"]

[tool.maturin]
module-name = "guide._core"
features = ["pyo3/extension-module"]
exclude = [
    { path = "uv.lock", format = "sdist" },
    { path = "examples/*.ipynb", format = "sdist" },
]

[tool.uv]
# Rebuild the extension when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../Cargo.toml" },
    { file = "../src/**/*.rs" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# The compiled guide._core module has no source file for ruff to find.
known-first-party = ["guide"]
