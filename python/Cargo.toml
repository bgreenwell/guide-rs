[package]
name = "guide-rs-python"
version = "0.2.0"
edition = "2024"
description = "Python bindings for guide-rs"
authors = ["Brandon Greenwell <greenwell.brandon@gmail.com>"]
license = "MIT"
repository = "https://github.com/bgreenwell/guide-rs"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
guide-rs = { path = ".." }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
rayon = "1"
serde_json = "1"

# A separate workspace keeps pyo3 out of the core crate's build and lockfile.
[workspace]

[profile.release]
lto = true
codegen-units = 1
