name: Wheels
on:
  pull_request:
    paths:
      - python/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/wheels.yml
  push:
    tags: ["python-v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          maturin-version: "1.15.0"
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          maturin-version: "1.15.0"
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist
  test:
    # Installs each wheel in a clean environment and runs the test suite on it.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
        platform:
          - { os: ubuntu-latest, wheel: wheel-ubuntu-latest-x86_64 }
          - { os: ubuntu-24.04-arm, wheel: wheel-ubuntu-latest-aarch64 }
          - { os: macos-latest, wheel: wheel-macos-latest-aarch64 }
          - { os: macos-26-intel, wheel: wheel-macos-latest-x86_64 }
          - { os: windows-latest, wheel: wheel-windows-latest-x64 }
    name: test (${{ matrix.platform.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform.wheel }}
          path: dist
      # --no-index: with --find-links alone, pip can pick the same version from
      # PyPI, and the job would test the published wheel instead of this build.
      - run: python -m pip install --no-index --no-deps --find-links dist guide-rs
      - run: python -m pip install guide-rs pytest pandas matplotlib
      # The pytest executable puts only python/tests on sys.path, so `import
      # guide` loads the installed wheel rather than the source tree.
      - run: pytest -q -p no:cacheprovider python/tests
  test-bare:
    # The test job adds pandas and matplotlib; users of a plain `pip install`
    # have neither, so the README's examples must run without them.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist
      - run: python -m pip install --no-index --no-deps --find-links dist guide-rs
      - run: python -m pip install guide-rs
      - name: Run the README's examples
        shell: python
        run: |
          import importlib.util
          import re
          from pathlib import Path

          assert importlib.util.find_spec("pandas") is None
          assert importlib.util.find_spec("matplotlib") is None
          readme = Path("python/README.md").read_text()
          for block in re.findall(r"```python\n(.*?)```", readme, re.DOTALL):
              # plot_tree is documented as needing the plot extra.
              if "plot_tree" not in block:
                  exec(block)
  test-sdist:
    # Platforms without a wheel build from the sdist, so it has to compile.
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: python -m pip install dist/*.tar.gz pytest pandas matplotlib
      - run: pytest -q -p no:cacheprovider python/tests
  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [build, sdist, test, test-bare, test-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          test "python-v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
